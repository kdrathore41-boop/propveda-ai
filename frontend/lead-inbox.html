<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>PropVeda — Lead Inbox</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#102036;--line:#28415c;--text:#edf4ff;--muted:#9aacc3;--accent:#64d7c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial}main{max-width:1000px;margin:auto;padding:18px 12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0a1728;color:var(--text)}button{background:var(--accent);color:#06131e;font-weight:800;cursor:pointer}.top{display:flex;gap:8px;flex-wrap:wrap}.top input{flex:1;min-width:220px}.muted{color:var(--muted);font-size:12px}.lead{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lead h3{margin:0 0 6px}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:99px;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.err{color:#ff9dad}.ok{color:var(--accent)}a{color:var(--accent)}@media(max-width:600px){.lead{grid-template-columns:1fr}}
</style></head><body><main>
<h1>PropVeda · Qualified Buyer Lead Inbox</h1><p class="muted">Admin-only view. Enter the LEAD_ADMIN_TOKEN configured in Render. The token is kept only in this page's memory and is not saved.</p>
<div class="card"><div class="top"><input id="token" type="password" autocomplete="off" placeholder="LEAD_ADMIN_TOKEN"><button id="load">Load leads</button></div><p id="msg" class="muted" aria-live="polite"></p></div>
<div id="leads"></div>
<script>
const token=document.getElementById('token'),msg=document.getElementById('msg'),list=document.getElementById('leads');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function call(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token.value,...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d;}
async function load(){if(!token.value){msg.textContent='Enter the admin token first.';return;}msg.textContent='Loading…';list.innerHTML='';try{const d=await call('/api/lead-inbox');msg.textContent=d.count+' lead(s)';list.innerHTML=(d.leads||[]).map(x=>'<section class="card"><div class="row"><h3>'+esc(x.name)+'</h3><span class="pill">'+esc(x.qualification)+' · '+esc(x.status)+'</span></div><div class="lead"><div><b>Phone:</b> <a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a><br><b>Email:</b> '+esc(x.email||'—')+'<br><b>Budget:</b> ₹'+Number(x.budgetMax||0).toLocaleString('en-IN')+'<br><b>Purpose:</b> '+esc(x.purpose)+'</div><div><b>Location:</b> '+esc(x.location)+'<br><b>Type:</b> '+esc((x.propertyTypes||[]).join(', '))+'<br><b>Timeline:</b> '+esc(x.timeline)+'<br><b>Site visit:</b> '+esc(x.siteVisit)+'<br><b>WhatsApp:</b> '+esc(x.whatsappNotification?.status||'UNKNOWN')+'</div></div><p class="muted">Created: '+esc(x.createdAt)+' · Ref: '+esc(x.leadId)+'</p><div class="top"><select id="status-'+esc(x.leadId)+'"><option>NEW</option><option>CONTACTED</option><option>QUALIFIED</option><option>VISIT_SCHEDULED</option><option>CLOSED_WON</option><option>CLOSED_LOST</option><option>NURTURE</option></select><button onclick="updateStatus(\''+esc(x.leadId)+'\')">Update status</button></div></section>').join('')||'<div class="card">No leads received yet.</div>'; }catch(e){msg.className='err';msg.textContent=e.message;}}
async function updateStatus(id){try{const status=document.getElementById('status-'+id).value;await call('/api/lead-inbox/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});msg.className='ok';msg.textContent='Status updated.';await load();}catch(e){msg.className='err';msg.textContent=e.message;}}
document.getElementById('load').addEventListener('click',load);
</script></main></body></html>
