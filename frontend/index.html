<script>
let property=null,user=null;
let properties=[];
let selectedProperties=[];

const $=id=>document.getElementById(id);

const discoveryQueryEl=$('discoveryQuery');
const discoveryParsedEl=$('discoveryParsed');
const discoveryResultsEl=$('discoveryResults');
const comparePanelEl=$('comparePanel');
const dimEl=$('dim');
const srcEl=$('src');
const obsEl=$('obs');
const docnameEl=$('docname');
const doctypeEl=$('doctype');

const API='https://propveda-ai.onrender.com/api';

async function api(path,options={}){
  const res=await fetch(API+path,{
    headers:{'Content-Type':'application/json',...(options.headers||{})},
    ...options
  });

  const text=await res.text();
  let data=null;

  try{
    data=text?JSON.parse(text):null;
  }catch{
    data={raw:text};
  }

  if(!res.ok){
    throw new Error(
      data?.error ||
      data?.message ||
      `API ${res.status}`
    );
  }

  return data;
}

function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function setText(id,value){
  const el=$(id);
  if(el)el.textContent=value??'—';
}

function setStatus(id,value){
  const el=$(id);
  if(el)el.textContent=value??'Ready';
}

function renderProperty(p){
  const el=$('property');
  if(!el)return;

  if(!p){
    el.innerHTML='<div class="empty">No property available.</div>';
    return;
  }

  el.innerHTML=`
    <div class="propertyTitle">${esc(p.name||p.propertyId||'Property')}</div>
    <div class="small">${esc(p.location||'Location not recorded')}</div>
    <div class="chips" style="margin-top:10px">
      <span class="chip">ID: ${esc(p.propertyId||p.id)}</span>
      <span class="chip">Khasra: ${esc(p.khasra||'Not recorded')}</span>
      <span class="chip">District: ${esc(p.district||'Jabalpur')}</span>
    </div>
  `;
}

function renderAssessment(a){
  const el=$('assessment');
  if(!el)return;

  if(!a){
    el.innerHTML='<div class="empty">Assessment not available.</div>';
    return;
  }

  const dims=a.dimensions||{};
  const keys=Object.keys(dims);

  $('assessmentStatus').textContent=a.decision||'NOT_CHECKED';

  if(!keys.length){
    el.innerHTML='<div class="empty">No assessment dimensions recorded.</div>';
    return;
  }

  el.innerHTML=keys.map(k=>{
    const d=dims[k]||{};
    return `
      <div class="dim">
        <div class="row">
          <span>${esc(k)}</span>
          <span class="status">${esc(d.status||'NOT_CHECKED')} · ${esc(d.confidence||'UNKNOWN')}</span>
        </div>
        <div class="small">
          Evidence: ${esc(d.evidenceCount??0)}
        </div>
      </div>
    `;
  }).join('');
}

function renderEvidence(list){
  const el=$('evidence');
  if(!el)return;

  if(!Array.isArray(list)||!list.length){
    el.innerHTML='<div class="empty">No evidence records yet.</div>';
    return;
  }

  el.innerHTML=list.map(e=>`
    <div class="dim">
      <div class="row">
        <b>${esc(e.dimension||'UNKNOWN')}</b>
        <span class="status">${esc(e.status||'NOT_CHECKED')}</span>
      </div>
      <div class="small">${esc(e.observation||'No observation')}</div>
      <div class="footerNote">
        Source: ${esc(e.sourceKey||e.source||'UNKNOWN')}
        · Confidence: ${esc(e.confidence||'UNKNOWN')}
      </div>
    </div>
  `).join('');
}

function renderGraph(g){
  const el=$('evidenceGraph');
  if(!el)return;

  if(!g||!Array.isArray(g.nodes)){
    el.innerHTML='<div class="empty">Evidence graph unavailable.</div>';
    setStatus('graphState','Unavailable');
    return;
  }

  const nodes=g.nodes;
  const edges=g.edges||[];

  if(!nodes.length){
    el.innerHTML='<div class="empty">No graph records yet.</div>';
    setStatus('graphState','Empty');
    return;
  }

  const width=Math.max(720,Math.min(1400,nodes.length*150));
  const height=340;

  const positions=nodes.map((n,i)=>{
    const x=60+(i%7)*Math.max(95,(width-120)/7);
    const y=65+Math.floor(i/7)*100;
    return {...n,x,y};
  });

  const lookup={};
  positions.forEach(n=>lookup[n.id]=n);

  const lines=edges.map(e=>{
    const a=lookup[e.from];
    const b=lookup[e.to];
    if(!a||!b)return '';
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#38506d" stroke-width="1.5"/>`;
  }).join('');

  const circles=positions.map(n=>`
    <g class="graphNode">
      <circle cx="${n.x}" cy="${n.y}" r="27" fill="#132238" stroke="#64d7c7"/>
      <text x="${n.x}" y="${n.y-2}" text-anchor="middle" fill="#edf4ff" font-size="9">${esc(String(n.type||'NODE').slice(0,13))}</text>
      <text x="${n.x}" y="${n.y+11}" text-anchor="middle" fill="#91a3bb" font-size="8">${esc(String(n.label||'').slice(0,18))}</text>
    </g>
  `).join('');

  el.innerHTML=`
    <svg class="graphSvg" viewBox="0 0 ${width} ${height}">
      ${lines}
      ${circles}
    </svg>
  `;

  setStatus('graphState',`${nodes.length} nodes · ${edges.length} links`);
}

function renderTimeline(id,items,empty='No records.'){
  const el=$(id);
  if(!el)return;

  if(!Array.isArray(items)||!items.length){
    el.innerHTML=`<div class="empty">${empty}</div>`;
    return;
  }

  el.innerHTML=items.slice(0,12).map(x=>{
    const title=x.title||x.action||x.type||x.event||x.code||'Record';
    const body=x.description||x.message||x.detail||x.scenario||x.dimension||'Stored system record';
    const time=x.createdAt||x.generatedAt||x.observedAt||x.updatedAt||'';

    return `
      <div class="event">
        <i class="dot"></i>
        <div>
          <b>${esc(title)}</b>
          <div class="small">${esc(body)}</div>
          ${time?`<div class="footerNote">${esc(time)}</div>`:''}
        </div>
      </div>
    `;
  }).join('');
}

function renderScenario(s){
  const el=$('scenarioConsole');
  const actions=$('scenarioActions');

  if(el){
    const signals=s?.opportunitySignals||[];
    const risks=s?.riskScenarios||[];

    el.innerHTML=[
      ...signals.map(x=>`
        <div class="event">
          <i class="dot"></i>
          <div>
            <b>${esc(x.label||x.code)}</b>
            <div class="small">${esc(x.basis||'Evidence-grounded signal')}</div>
          </div>
        </div>
      `),
      ...risks.map(x=>`
        <div class="event">
          <i class="dot"></i>
          <div>
            <b>${esc(x.dimension||x.code||'Risk scenario')}</b>
            <div class="small">${esc(x.scenario||'Uncertainty remains to be verified.')}</div>
          </div>
        </div>
      `)
    ].join('')||'<div class="empty">No scenario signals yet.</div>';
  }

  if(actions){
    const list=s?.nextVerificationActions||[];
    actions.innerHTML=list.map(x=>`
      <div class="dim">
        <div class="row">
          <b>${esc(x.dimension||'Verification')}</b>
          <span class="status">${esc(x.priority||'MEDIUM')}</span>
        </div>
        <div class="small">${esc(x.action||'Verify evidence')}</div>
      </div>
    `).join('')||'<div class="empty">No priority actions yet.</div>';
  }
}

function renderPortfolio(list){
  const el=$('portfolioGrid');
  if(!el)return;

  if(!Array.isArray(list)||!list.length){
    el.innerHTML='<div class="empty">No portfolio properties available.</div>';
    setStatus('portfolioState','Empty');
    return;
  }

  el.innerHTML=list.map(p=>`
    <div class="card" style="margin:0">
      <b>${esc(p.name||p.propertyId||p.id)}</b>
      <div class="small">${esc(p.location||'')}</div>
      <div class="footerNote">Evidence: ${esc(p.evidenceCount??'—')} · Decision: ${esc(p.decision||'NOT_CHECKED')}</div>
      <button class="secondary" style="margin-top:9px" onclick="toggleCompare('${esc(p.id)}')">
        Compare
      </button>
    </div>
  `).join('');

  setStatus('portfolioState',`${list.length} properties`);
}

function renderCompare(){
  if(!comparePanelEl)return;

  if(!selectedProperties.length){
    comparePanelEl.innerHTML='<div class="empty">No properties selected.</div>';
    return;
  }

  const rows=selectedProperties.map(p=>`
    <div class="mutedbox">
      <b>${esc(p.name||p.propertyId||p.id)}</b>
      <div class="small">${esc(p.location||'')}</div>
      <div class="footerNote">
        Khasra: ${esc(p.khasra||'Not recorded')}
        · District: ${esc(p.district||'')}
      </div>
    </div>
  `).join('');

  comparePanelEl.innerHTML=rows;
}

async function loadAll(){
  setText('system','Connecting…');
  setText('queue','Loading intelligence…');

  try{
    const health=await api('/health');
    setText('system','ONLINE');
    setText('queue',`API ${health.version||'ready'}`);
  }catch(err){
    setText('system','OFFLINE');
    setText('queue',err.message);
    return;
  }

  try{
    const data=await api('/properties');
    properties=Array.isArray(data)
      ? data
      : Array.isArray(data?.properties)
        ? data.properties
        : [];

    property=properties[0]||null;
    renderProperty(property);
    renderPortfolio(properties);
  }catch(err){
    renderProperty(null);
    setText('queue',`Property API: ${err.message}`);
    return;
  }

  if(!property)return;

  const id=encodeURIComponent(property.id);

  const jobs=[
    ['assessment',`/properties/${id}/assessment`],
    ['evidence',`/properties/${id}/evidence`],
    ['graph',`/properties/${id}/evidence-graph`],
    ['scenario',`/properties/${id}/scenario-intelligence`],
    ['reassessment',`/properties/${id}/decision-reassessment`],
    ['actions',`/properties/${id}/action-orchestration`],
    ['timeline',`/properties/${id}/timeline`],
    ['snapshots',`/properties/${id}/snapshots`],
    ['verification',`/properties/${id}/verification-workspace`],
    ['provenance',`/properties/${id}/provenance`],
    ['watchtower',`/properties/${id}/watchtower`]
  ];

  const results=await Promise.all(
    jobs.map(async([key,path])=>{
      try{
        return [key,await api(path)];
      }catch(err){
        return [key,{error:err.message}];
      }
    })
  );

  const data=Object.fromEntries(results);

  const assessment=data.assessment;
  const evidence=data.evidence;

  if(assessment&&!assessment.error){
    renderAssessment(assessment);

    setText(
      'decisionTop',
      assessment.decision||'NOT_CHECKED'
    );

    const dims=assessment.dimensions||{};
    const open=Object.values(dims)
      .filter(x=>['NOT_CHECKED','UNRESOLVED','CONFLICTING'].includes(x?.status))
      .length;

    setText('gapCount',open);
  }

  const evidenceList=
    Array.isArray(evidence)
      ? evidence
      : Array.isArray(evidence?.evidence)
        ? evidence.evidence
        : [];

  renderEvidence(evidenceList);
  setText('evCount',evidenceList.length);

  if(data.graph&&!data.graph.error){
    renderGraph(data.graph);
  }else{
    setStatus('graphState','Unavailable');
  }

  if(data.scenario&&!data.scenario.error){
    renderScenario(data.scenario);

    const c=data.scenario.currentState?.coverage;
    if(typeof c==='number'){
      setText('supportPct',`${c}%`);
      $('supportBar').style.width=`${Math.max(0,Math.min(100,c))}%`;
    }
  }

  if(data.reassessment&&!data.reassessment.error){
    const items=
      data.reassessment.items||
      data.reassessment.changes||
      data.reassessment.events||
      [];
    renderTimeline('reassessment',items,'No reassessment changes recorded.');
    setStatus('reassessState','Ready');
  }else{
    setStatus('reassessState','Unavailable');
  }

  if(data.actions&&!data.actions.error){
    const items=
      data.actions.actions||
      data.actions.queue||
      data.actions.items||
      [];
    renderTimeline('actionQueue',items,'No workflow actions recorded.');
    setStatus('actionState','Ready');
  }else{
    setStatus('actionState','Unavailable');
  }

  if(data.timeline&&!data.timeline.error){
    const items=
      data.timeline.events||
      data.timeline.items||
      data.timeline.timeline||
      [];
    renderTimeline('propertyTimeline',items,'No timeline records yet.');
    setStatus('timelineState','Ready');
  }else{
    setStatus('timelineState','Unavailable');
  }

  if(data.snapshots&&!data.snapshots.error){
    const items=
      data.snapshots.snapshots||
      data.snapshots.items||
      [];
    renderTimeline('snapshotPanel',items,'No snapshots created yet.');
    setStatus('snapshotState','Ready');
  }else{
    setStatus('snapshotState','Unavailable');
  }

  if(data.verification&&!data.verification.error){
    const items=
      data.verification.cases||
      data.verification.items||
      data.verification.workspace||
      [];
    renderTimeline('verificationWorkspace',items,'No verification cases yet.');
    setStatus('verifyState','Ready');
  }else{
    setStatus('verifyState','Unavailable');
  }

  if(data.provenance&&!data.provenance.error){
    const items=
      data.provenance.events||
      data.provenance.items||
      data.provenance.records||
      [];
    renderTimeline('provenancePanel',items,'No provenance records yet.');
    setStatus('provState','Ready');
  }else{
    setStatus('provState','Unavailable');
  }

  if(data.watchtower&&!data.watchtower.error){
    const items=
      data.watchtower.alerts||
      data.watchtower.items||
      data.watchtower.events||
      [];
    renderTimeline('watchtower',items,'No watchtower signals yet.');
    setStatus('watchState','Ready');
  }else{
    setStatus('watchState','Unavailable');
  }

  setText('queue','Intelligence loaded');
}

async function runDiscovery(){
  const q=discoveryQueryEl?.value?.trim();

  if(!q){
    discoveryParsedEl.innerHTML='<div class="empty">Describe your property requirement first.</div>';
    return;
  }

  discoveryParsedEl.innerHTML=
    `<div class="mutedbox">Requirement captured: <b>${esc(q)}</b></div>`;

  const matches=properties.filter(p=>{
    const text=JSON.stringify(p).toLowerCase();
    return q.toLowerCase().split(/\s+/)
      .filter(x=>x.length>3)
      .some(x=>text.includes(x));
  });

  discoveryResultsEl.innerHTML=
    (matches.length?matches:properties).map(p=>`
      <div class="dim">
        <div class="row">
          <b>${esc(p.name||p.propertyId)}</b>
          <button class="secondary" onclick="selectProperty('${esc(p.id)}')">Inspect</button>
        </div>
        <div class="small">${esc(p.location||'')}</div>
      </div>
    `).join('')||
    '<div class="empty">No properties found.</div>';
}

function clearDiscovery(){
  if(discoveryQueryEl)discoveryQueryEl.value='';
  if(discoveryParsedEl)discoveryParsedEl.innerHTML='';
  if(discoveryResultsEl)discoveryResultsEl.innerHTML='';
}

function selectProperty(id){
  const p=properties.find(x=>x.id===id);
  if(!p)return;
  property=p;
  renderProperty(property);
  loadAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleCompare(id){
  const p=properties.find(x=>x.id===id);
  if(!p)return;

  const exists=selectedProperties.some(x=>x.id===id);

  selectedProperties=exists
    ? selectedProperties.filter(x=>x.id!==id)
    : [...selectedProperties,p];

  renderCompare();
}

async function addEvidence(event){
  event.preventDefault();

  if(!property)return;

  const payload={
    propertyId:property.id,
    dimension:dimEl.value,
    source:srcEl.value.trim(),
    observation:obsEl.value.trim()
  };

  try{
    await api('/evidence',{
      method:'POST',
      body:JSON.stringify(payload)
    });

    obsEl.value='';
    await loadAll();
    alert('Evidence added successfully.');
  }catch(err){
    alert(`Evidence could not be added: ${err.message}`);
  }
}

async function addDoc(event){
  event.preventDefault();

  if(!property)return;

  const payload={
    propertyId:property.id,
    name:docnameEl.value.trim(),
    type:doctypeEl.value,
    text:$('doctext').value.trim()
  };

  try{
    const result=await api('/documents',{
      method:'POST',
      body:JSON.stringify(payload)
    });

    $('docs').innerHTML=`
      <div class="mutedbox">
        <b>Document analyzed</b>
        <div class="small">${esc(result?.status||'Analysis stored')}</div>
      </div>
    `;
  }catch(err){
    $('docs').innerHTML=
      `<div class="mutedbox">Document API: ${esc(err.message)}</div>`;
  }
}

  if(!property)return;

  const el=$('readiness');
  el.innerHTML='<div class="empty">Checking readiness…</div>';

  try{
    const r=await api(`/properties/${encodeURIComponent(property.id)}/transaction-readiness`);
    el.innerHTML=`
      <div class="mutedbox">
        <b>${esc(r.decision||r.status||'READINESS REVIEW')}</b>
        <div class="small">${esc(r.summary||'Evidence-based readiness response received.')}</div>
      </div>
    `;
  }catch(err){
    el.innerHTML=`<div class="mutedbox">${esc(err.message)}</div>`;

}

  if(!property)return;

  try{

      method:'POST',
      body:JSON.stringify({
        purpose:$('bpurpose').value,
        riskPreference:$('brisk').value,
        budget:$('bbudget').value,
        timeline:$('btimeline').value,

    el.innerHTML=`
      <div class="mutedbox">
        <b>${esc(r.decision||r.status||'Buyer context processed')}</b>
        <div class="small">${esc(r.summary||r.message||'Evidence-grounded buyer analysis completed.')}</div>
      </div>
    `;
  }catch(err){
    el.innerHTML=`<div class="mutedbox">${esc(err.message)}</div>`;
  }

async function createSnapshot(){
  if(!property)return;

  try{
    const r=await api(`/properties/${encodeURIComponent(property.id)}/snapshots`,{
      method:'POST',
      body:JSON.stringify({})
    });

    $('snapshotPanel').innerHTML=`
      <div class="mutedbox">
        <b>Snapshot created</b>
        <div class="small">${esc(r.id||r.snapshotId||'Stored')}</div>
      </div>
    `;

    await loadAll();
  }catch(err){
    $('snapshotPanel').innerHTML=
      `<div class="mutedbox">${esc(err.message)}</div>`;
  }
}

  try{
    await api('/contacts',{
      method:'POST',
      body:JSON.stringify({
        name:$('cname').value,
        contact:$('ccontact').value,
        email:$('cemail').value,
        purpose:$('purpose').value
      })
    });

    $('crmmsg').textContent='Contact created with purpose-bound consent workflow.';
  }catch(err){
    $('crmmsg').textContent=err.message;
  }

async function grantConsent(){
  $('crmmsg').textContent='Research consent request recorded for review.';
}

async function requestConsultation(){
  $('crmmsg').textContent='Consultation request recorded.';
}

async function saveReport(){
  if(!property){
    alert('No property loaded.');
    return;
  }

  try{
    const r=await api(`/properties/${encodeURIComponent(property.id)}/reports`,{
      method:'POST',
      body:JSON.stringify({
        type:'INTELLIGENCE_REPORT'
      })
    });

    alert(`Report generated: ${r.id||r.reportId||'stored'}`);
  }catch(err){
    alert(`Report generation: ${err.message}`);
  }
}

window.addEventListener('DOMContentLoaded',loadAll);
  </script>
