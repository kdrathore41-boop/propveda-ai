name: Prepare PropVeda

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for PropVeda ZIP
        run: |
          if [ ! -f "PropVeda-v29.zip" ]; then
            echo "PropVeda-v29.zip not found. Nothing to unpack."
            exit 0
          fi

      - name: Unpack PropVeda
        run: |
          unzip -o "PropVeda-v29.zip" -d /tmp/propveda

          cp -R /tmp/propveda/. . 2>/dev/null || true

          find . -maxdepth 2 -type f | sort

      - name: Remove deployment ZIP
        run: |
          rm -f "PropVeda-v29.zip"

      - name: Commit prepared project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prepare PropVeda deployment files"
            git push
          fi
